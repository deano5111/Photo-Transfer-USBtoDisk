# /etc/usb-image-import.conf — settings for usb-image-import
# install.sh fills in DEST_UUID and TARGET_USER for you.

# Destination drive, identified by filesystem UUID (find with: lsblk -o NAME,LABEL,UUID)
DEST_UUID=""

# Folder on the destination drive where imports go
DEST_SUBDIR="Imported Images"

# Where to mount the destination if it isn't already mounted
DEST_MOUNTPOINT="/mnt/image-dest"

# Desktop user who owns copied files (FAT/NTFS), sees the progress window and notifications
TARGET_USER=""

# File extensions to treat as images (case-insensitive, space separated)
IMAGE_EXTS="jpg jpeg jpe png gif bmp tif tiff webp heic heif avif
            dng cr2 cr3 crw nef nrw arw srf sr2 orf rw2 raf pef srw x3f 3fr erf kdc mrw rwl iiq"

# Set to "yes" to also copy videos
INCLUDE_VIDEOS="no"
VIDEO_EXTS="mp4 mov m4v avi mts m2ts 3gp mkv"

# Seconds to wait for the desktop to auto-mount the device before mounting it ourselves
SETTLE_SECONDS=5

# USB serial numbers to never auto-import (e.g. a failing drive you're rescuing with ddrescue).
# Find a drive's serial with: udevadm info -q property -n /dev/sdX | grep ID_SERIAL_SHORT
IGNORE_SERIALS=""
